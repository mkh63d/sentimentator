name: Build and Push Docker Image for C# Core Orchestrator
on:
    push:
        branches:
            - main
            - dev
        paths:
            - "core_orchestrator/**"
            - ".github/workflows/build-and-push-core-orchestrator.yml"
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    SERVICE_NAME: core_orchestrator
    DOTNET_VERSION: "10.0.x"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Restore dependencies
              working-directory: ./core_orchestrator
              run: dotnet restore

            - name: Build solution
              working-directory: ./core_orchestrator
              run: dotnet build --configuration Release --no-restore

            - name: Run tests
              working-directory: ./core_orchestrator
              run: dotnet test --configuration Release --no-build --verbosity normal
              continue-on-error: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}
                  tags: |
                      type=ref,event=branch
                  flavor: |
                      latest=false

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./core_orchestrator
                  file: ./core_orchestrator/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      http_port=80
