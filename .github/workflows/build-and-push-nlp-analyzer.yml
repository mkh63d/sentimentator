name: Build and Push Docker Image for Python NLP Analyzer
on:
    push:
        branches:
            - main
            - dev
        paths:
            - "NLP_analyzer_service/**"
            - ".github/workflows/build-and-push-nlp-analyzer.yml"
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    SERVICE_NAME: sentiment_analyzer

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Verify dependencies
              working-directory: ./NLP_analyzer_service
              run: |
                  python -m pip install --upgrade pip
                  pip install -r resources/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
              continue-on-error: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}
                  tags: |
                      type=ref,event=branch
                  flavor: |
                      latest=false

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./NLP_analyzer_service
                  file: ./NLP_analyzer_service/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
