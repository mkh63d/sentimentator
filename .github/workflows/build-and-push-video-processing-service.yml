name: Build and Push Docker Image for Go Video Processing Service
on:
    push:
        branches:
            - main
            - dev
            - gopher
        paths:
            - "video_processing_service/**"
            - ".github/workflows/build-and-push-video-processing-service.yml"
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    SERVICE_NAME: video_processing_service

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"

            - name: Install templ
              shell: bash
              run: go install github.com/a-h/templ/cmd/templ@latest

            - name: Run templ generate
              shell: bash
              run: templ generate -path ./video_processing_service

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}
                  tags: |
                      type=ref,event=branch
                  flavor: |
                      latest=false

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./video_processing_service
                  file: ./video_processing_service/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
