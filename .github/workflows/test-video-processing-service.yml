name: Test Go Video Processing Service

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"

            - name: Install templ
              shell: bash
              run: go install github.com/a-h/templ/cmd/templ@latest
            - name: Run templ generate
              shell: bash
              run: templ generate -path .

            - name: Build
              run: go build -v ./...
            - name: Test with the Go CLI
              run: go test ./...
