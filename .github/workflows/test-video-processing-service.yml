name: Test Go Video Processing Service

on:
    pull_request:
        branches:
            - main
            - dev
        paths:
            - "video_processing_service/**"
            - ".github/workflows/test-video-processing-service.yml"
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.25.x"

            - name: Install templ
              shell: bash
              run: go install github.com/a-h/templ/cmd/templ@latest

            - name: Run templ generate
              shell: bash
              run: templ generate -path ./video_processing_service

            - name: Build
              working-directory: ./video_processing_service
              run: go build -v ./...

            - name: Test with the Go CLI
              working-directory: ./video_processing_service
              run: go test -v ./...
