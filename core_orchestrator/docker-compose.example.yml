services:
  rabbitmq:
    image: rabbitmq:4.1.4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  orchestrator:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        http_port: 80
    ports:
      - "8080:80"
    environment:
      ORCHESTRATOR_POSTGRES_CONN_STRING: 'Server=postgres;Port=5432;Database=orchestrator;User Id=postgres;Password=postgres;'
      ORCHESTRATOR_RABBITMQ_URI: 'amqp://guest:guest@rabbitmq:5672/'
      ORCHESTRATOR_RESEND_API_KEY: ''
    depends_on:
      rabbitmq:
        condition: service_healthy
        restart: true
      postgres:
        condition: service_healthy
        restart: true
          
networks:
  default:
    name: sentimentator-net-example

volumes:
  postgres_data: