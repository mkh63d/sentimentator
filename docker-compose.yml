services:
    orchestrator:
        image: ghcr.io/oskarowski/sentimentator/core_orchestrator:dev
        depends_on:
            rabbitmq:
                condition: service_started
            postgres:
                condition: service_healthy
        environment:
            - ORCHESTRATOR_POSTGRES_CONN_STRING=Server=postgres;Port=5432;Database=orchestrator_db;User Id=${ORCHESTRATOR_DB_USER};Password=${ORCHESTRATOR_DB_PASS};
            - ORCHESTRATOR_RABBITMQ_URI=${AMQP_URL}
            - ORCHESTRATOR_RESEND_API_KEY=${ORCHESTRATOR_RESEND_API_KEY}
            - ASPNETCORE_URLS=http://+:80
        ports:
            - "8081:80"

    video-processing-service:
        image: ghcr.io/oskarowski/sentimentator/video_processing_service:dev
        depends_on:
            rabbitmq:
                condition: service_started
            postgres:
                condition: service_healthy
        environment:
            - PORT=8080
            - APP_ENV=${APP_ENV}
            - SENTIMENTATOR_VPS_DB_HOST=postgres
            - SENTIMENTATOR_VPS_DB_PORT=5432
            - SENTIMENTATOR_VPS_DB_DATABASE=video_processing_db
            - SENTIMENTATOR_VPS_DB_SCHEMA=public
            - SENTIMENTATOR_VPS_DB_USERNAME=${VPS_DB_USER}
            - SENTIMENTATOR_VPS_DB_PASSWORD=${VPS_DB_PASS}
            - AMQP_URL=${AMQP_URL}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - WHISPER_MOCK_MODE=${WHISPER_MOCK_MODE}
        ports:
            - "8080:8080"

    sentiment-analyzer-placeholder-service:
        image: ghcr.io/oskarowski/sentimentator/sentiment_analyzer_placeholder_service:dev
        depends_on:
            rabbitmq:
                condition: service_started
        environment:
            - RABBITMQ_URL=${AMQP_URL}
            - TRANSCRIPT_QUEUE=video.transcript
            - ANALYSIS_EXCHANGE=sentimentator.topic
            - ANALYSIS_QUEUE=video.analysis
            - ANALYSIS_ROUTING_KEY=video.analysis.completed
            - LOG_LEVEL=info

    # nlp-analyzer:
    #     build: ./NLP_analyzer_service
    #     depends_on:
    #         - rabbitmq
    #     environment:
    #         - RABBITMQ_URL=${AMQP_URL}

    frontend:
        image: ghcr.io/oskarowski/sentimentator/core_frontend:dev
        depends_on:
            orchestrator:
                condition: service_started
        ports:
            - "8000:8000"
        environment:
            VITE_BACKEND_API: ${VITE_BACKEND_API}
            VITE_DEMO_MODE: ${VITE_DEMO_MODE}
            VITE_REGISTER_ENABLED: ${VITE_REGISTER_ENABLED}

    rabbitmq:
        image: rabbitmq:4.1.4-management
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
        ports:
            - "5672:5672"
            # Expose management UI to localhost only for debug/development.
            - "127.0.0.1:15672:15672"
        # volumes:
        #     - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        #     - ./rabbitmq/certs:/etc/rabbitmq/certs:ro
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 5s
            retries: 5

    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
            ORCHESTRATOR_DB_USER: ${ORCHESTRATOR_DB_USER}
            ORCHESTRATOR_DB_PASS: ${ORCHESTRATOR_DB_PASS}
            VPS_DB_USER: ${VPS_DB_USER}
            VPS_DB_PASS: ${VPS_DB_PASS}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    default:
        name: sentimentator-net

volumes:
    postgres_data:
