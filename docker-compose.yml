version: "3.9"

services:
    orchestrator:
        build: ./core_orchestrator
        depends_on:
            - rabbitmq
            - postgres
        environment:
            - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
            - DATABASE_URL=postgresql://postgres:password@postgres:5432/sentimentator

    video-processing-service:
        build: ./video_processing_service
        # image: replace build with image when using prebuilt image
        depends_on:
            - rabbitmq
        environment:
            - PORT=8080
            - SENTIMENTATOR_VPS_DB_HOST=psql_vps
            - SENTIMENTATOR_VPS_DB_PORT=5432
            - SENTIMENTATOR_VPS_DB_USERNAME=sentimentator_vps_user
            - SENTIMENTATOR_VPS_DB_PASSWORD=sentimentator_vps_password
            - SENTIMENTATOR_VPS_DB_DATABASE=sentimentator_vps_db
            - SENTIMENTATOR_VPS_DB_SCHEMA=public
            - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
        ports:
            - "8080:8080"

    nlp-analyzer:
        build: ./NLP_analyzer_service
        depends_on:
            - rabbitmq
        environment:
            - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/

    frontend:
        build: ./core_frontend
        depends_on:
            - orchestrator

    rabbitmq:
        image: rabbitmq:4.1.4-management
        ports:
            - "5672:5672"
            - "15672:15672"

    postgres:
        image: postgres:18
        environment:
            POSTGRES_PASSWORD: sentimentator_password
            POSTGRES_DB: sentimentator_db
        ports:
            - "5432:5432"

networks:
    default:
        name: sentimentator-net
