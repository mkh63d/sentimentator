services:
    orchestrator:
        build: ./core_orchestrator
        depends_on:
            - rabbitmq
            - postgres
        environment:
            - RABBITMQ_URL=${AMQP_URL}
            - DATABASE_URL=postgresql://${ORCHESTRATOR_DB_USER}:${ORCHESTRATOR_DB_PASS}@postgres:5432/orchestrator_db

    video-processing-service:
        build: ./video_processing_service
        # image: replace build with image when using prebuilt image
        depends_on:
            rabbitmq:
                condition: service_started
            postgres:
                condition: service_healthy
        environment:
            - PORT=8080
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - SENTIMENTATOR_VPS_DB_HOST=postgres
            - SENTIMENTATOR_VPS_DB_PORT=5432
            - SENTIMENTATOR_VPS_DB_USERNAME=${VPS_DB_USER}
            - SENTIMENTATOR_VPS_DB_PASSWORD=${VPS_DB_PASS}
            - SENTIMENTATOR_VPS_DB_DATABASE=video_processing_db
            - SENTIMENTATOR_VPS_DB_SCHEMA=public
            - RABBITMQ_URL=${AMQP_URL}
        ports:
            - "8080:8080"

    nlp-analyzer:
        build: ./NLP_analyzer_service
        depends_on:
            - rabbitmq
        environment:
            - RABBITMQ_URL=${AMQP_URL}

    frontend:
        build: ./core_frontend
        depends_on:
            - orchestrator

    rabbitmq:
        image: rabbitmq:4.1.4-management
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
            RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
        ports:
            - "5672:5672"
            # Expose management UI to localhost only for debug/development.
            - "127.0.0.1:15672:15672"
        # volumes:
        #     - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        #     - ./rabbitmq/certs:/etc/rabbitmq/certs:ro
        healthcheck:
            test: rabbitmq-diagnostics -q ping
            interval: 10s
            timeout: 5s
            retries: 5

    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
            ORCHESTRATOR_DB_USER: ${ORCHESTRATOR_DB_USER}
            ORCHESTRATOR_DB_PASS: ${ORCHESTRATOR_DB_PASS}
            VPS_DB_USER: ${VPS_DB_USER}
            VPS_DB_PASS: ${VPS_DB_PASS}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./db/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    default:
        name: sentimentator-net

volumes:
    postgres_data:
